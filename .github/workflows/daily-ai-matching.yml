name: Daily Perfect Matches AI Processing

on:
  schedule:
    # Runs every day at 2 AM UTC (11 PM Argentina)
    - cron: '0 2 * * *'

  # Allows manual trigger from GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perfect_matches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Perfect Matches Algorithm
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
        run: |
          echo "🔍 Starting AI compatibility analysis..."
          npm run find:perfect-matches

      - name: Send notifications to users
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_NAME: ${{ secrets.APP_NAME }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          NODE_ENV: production
        run: |
          echo "📧 Sending notifications..."
          npm run send:notifications

      - name: Log completion
        run: echo "✅ Perfect Matches processing completed at $(date -u)"
