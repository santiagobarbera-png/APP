name: Build Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: node --check backend/server.js && node --check backend/app.js

      - name: Run linter
        run: npm run lint || true

      - name: Verify scripts exist
        run: |
          test -f scripts/findPerfectMatches.js && echo "✅ findPerfectMatches.js found"
          test -f scripts/sendNotifications.js && echo "✅ sendNotifications.js found"
          test -f database/migration.sql && echo "✅ migration.sql found"
